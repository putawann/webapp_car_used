<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarPrice - รู้มูลค่ารถของคุณ</title>
<meta name="description" content="ประเมินราคารถมือสองในตลาดไทยจากยี่ห้อ รุ่น ปี สเปก และเลขไมล์ ด้วยโมเดล XGBoost ที่รันในเบราว์เซอร์ (เดโมโครงการนักศึกษา)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%23f29a81' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 40l4-14c1-3 3-5 6-5h20c3 0 5 1 7 3l8 9c3 1 7 2 7 7v2H6z'/%3E%3Ccircle cx='18' cy='46' r='5'/%3E%3Ccircle cx='46' cy='46' r='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">

<script type="module" src="js/app.js"></script>
</head>
<body>


<header>
  <div class="brand"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 40l4-14c1-3 3-5 6-5h20c3 0 5 1 7 3l8 9c3 1 7 2 7 7v2H6z"/><circle cx="18" cy="46" r="5"/><circle cx="46" cy="46" r="5"/></svg><span data-i="brandName"></span><span class="tag" data-i="tag"></span></div>
  <div class="tools">
    <button id="langBtn" type="button" role="switch" aria-checked="false" aria-label="Language / ภาษา"><span>TH</span><span>EN</span></button>
    <button id="themeBtn" type="button"></button>
  </div>
</header>
<section class="hero" id="hero">
  <div class="in">

    <h1 data-i="title"></h1>
    <p class="lead" id="lead" data-i="heroSub"></p>

  </div>
</section>

<main>
  <form id="f" class="appraisal-form" novalidate>
    <section class="brand-picker" aria-labelledby="brandTitle">
      <div>
        <p class="step-label" data-i="brandStep"></p>
        <h2 id="brandTitle" data-i="chooseBrand"></h2>
      </div>
      <label class="brand-field"><span data-i="brand"></span><select id="brand"></select></label>
    </section>

    <section class="model-picker" aria-labelledby="modelsTitle">
      <div class="model-heading">
        <div>
          <p class="step-label" data-i="modelStep"></p>
          <h2 id="modelsTitle" data-i="chooseModel"></h2>
          <p class="sub" data-i="modelHint"></p>
        </div>
        <label class="model-field"><span data-i="modelList"></span><select id="model"></select></label>
      </div>
      <div class="model-track" id="modelTrack" role="group" data-al="chooseModel" tabindex="-1"></div>
      <div class="model-navigation">
        <button class="model-arrow" id="modelPrev" type="button" data-i="previousModel"></button>
        <p id="modelStatus" class="model-status" role="status"></p>
        <button class="model-arrow" id="modelNext" type="button" data-i="nextModel"></button>
      </div>
    </section>

  <section class="card details-card" id="form" aria-labelledby="detailsTitle">
    <p class="step-label" data-i="detailsStep"></p>
    <h2 id="detailsTitle" data-i="formTitle"></h2>
    <p class="sub" data-i="formSub"></p>
    <div class="chips" id="chips"><span data-i="examples"></span></div>
    <div class="details-grid">
      <label><span data-i="year"></span><select id="year"></select></label>
      <select id="color" hidden aria-hidden="true"></select>
      <div class="pair">
        <label><span data-i="cc"></span><select id="cc"></select></label>
        <label><span data-i="fuel"></span><select id="fuel"></select></label>
        <label><span data-i="trans"></span><select id="trans"></select></label>
        <label><span data-i="body"></span><select id="body"></select></label>
      </div>
      <div class="chips spec-chips" id="specs" aria-describedby="seen"></div>
      <small class="hint" id="seen"></small>

      <label class="full"><span data-i="mileage"></span><span class="unit"><input id="mileage" type="number" inputmode="numeric" min="0" max="300000" value="80000" aria-describedby="e-mileage"><i>km</i></span><input id="mileageR" type="range" min="0" max="300000" step="5000" data-al="mileage"><small class="e" id="e-mileage"></small></label>
      <button class="go full" type="submit" data-i="go"></button>
    </div>
  </section>
  </form>
  <section class="card result" aria-live="polite">
    <h2 data-i="resTitle"></h2>
    <div id="out"><p class="empty" data-i="empty"></p></div>
    <section class="card wide" id="more" hidden><h3 data-i="cTitle"></h3><div id="chart"></div></section>
    <div class="note"><span data-i="note"></span> <a href="https://putawann.github.io/car-price-v5/" target="_blank" rel="noopener" data-i="noteReport"></a></div>
  </section>

  <section class="card wide" id="cmp" hidden aria-live="polite"><h3 data-i="cmpTitle"></h3><div id="cmpBody"></div><button class="ghost" id="cmpClear" type="button" data-i="clear"></button></section>
</main>
<footer><span class="footer-brand">Car<span>Price</span></span><p data-i="heroSub"></p><a class="footer-link" href="credits.html" data-i="credits"></a></footer>
</body>
</html>
