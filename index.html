<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Used Car Price Demo</title>
<style>
:root{--bg:#f8f8f8;--card:#f8f8f8;--text:#2a2d31;--muted:#80868d;--line:#dcdfe3;--accent:#2b93ea;--ok:#2b93ea;--bad:#e5484d;--soft:#eef0f2;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,Menlo,"Courier New","Sarabun",monospace}
[data-theme="dark"]{--bg:#070b10;--card:#070b10;--text:#d6e6f5;--muted:#6f8396;--line:#1b2733;--accent:#3da5ff;--ok:#3da5ff;--bad:#ff6b70;--soft:#0e151d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--mono);font-size:.92rem;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
select option{background:var(--bg);color:var(--text)}
header,main{width:min(760px,100% - 32px);margin-inline:auto}
header{position:absolute;top:0;left:0;right:0;z-index:5;width:min(1100px,100% - 32px);display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand svg{width:20px;height:20px;color:var(--accent)}
.brand span+span{margin-left:2px}
.tag{padding:0 6px;border:1px solid var(--line);color:var(--muted);font-size:.68rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.tools{display:flex;gap:8px;align-items:center}
.tools button{display:grid;place-items:center;min-width:40px;height:36px;padding:0 10px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:0;font:inherit;font-size:.78rem;cursor:pointer;transition:border-color .2s,color .2s}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools #themeBtn{padding:0;width:36px}
.tools svg{width:16px;height:16px}
.tools #langBtn{position:relative;grid-template-columns:1fr 1fr;width:80px;padding:2px;font-weight:700}
#langBtn span{position:relative;z-index:1;display:grid;place-items:center;height:100%;color:var(--muted);transition:color .25s}
#langBtn::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);background:var(--accent);transition:transform .25s ease}
#langBtn[aria-checked=true]::before{transform:translateX(100%)}
#langBtn[aria-checked=false] span:first-child,#langBtn[aria-checked=true] span:last-child{color:var(--bg)}
.tools #langBtn:hover{color:var(--text)}

/* hero: เมฆจุดรูปรถ + วงแหวนแบบ ctOS */
.hero{--cy:34%;--r:min(42vw,330px);position:relative;overflow:hidden;min-height:max(620px,min(92vh,780px));min-height:max(620px,min(92svh,780px));display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center}
.hero::before,.hero::after{content:"";position:absolute;inset:0;pointer-events:none}
.hero::before{background:repeating-conic-gradient(from 0deg at 50% var(--cy),color-mix(in srgb,var(--text) 26%,transparent) 0 .45deg,transparent .45deg 2.2deg);-webkit-mask:radial-gradient(circle at 50% var(--cy),transparent 0,transparent var(--r),#000 var(--r),#000 calc(var(--r) + 22px),transparent calc(var(--r) + 23px));mask:radial-gradient(circle at 50% var(--cy),transparent 0,transparent var(--r),#000 var(--r),#000 calc(var(--r) + 22px),transparent calc(var(--r) + 23px));opacity:.4}
.hero::after{background:repeating-radial-gradient(circle at 50% var(--cy),transparent 0 15px,color-mix(in srgb,var(--text) 12%,transparent) 15px 16px);-webkit-mask:radial-gradient(circle at 50% var(--cy),transparent 0,transparent calc(var(--r) + 40px),#000 calc(var(--r) + 40px),transparent calc(var(--r) + 260px));mask:radial-gradient(circle at 50% var(--cy),transparent 0,transparent calc(var(--r) + 40px),#000 calc(var(--r) + 40px),transparent calc(var(--r) + 260px));opacity:.6}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.hero .in{position:relative;z-index:3;text-shadow:0 0 14px var(--bg),0 0 3px var(--bg);width:min(640px,100% - 32px);padding-bottom:clamp(28px,6vh,56px)}
.hello{margin:0 0 8px;font-size:clamp(1rem,2.6vw,1.25rem);letter-spacing:.02em}
.hero h1{text-wrap:balance;margin:0 0 14px;font-size:clamp(1.55rem,5vw,2.6rem);line-height:1.2;font-weight:700;letter-spacing:-.02em}
.lead{margin:0 auto 22px;color:var(--muted);max-width:34em;min-height:3.3em}
.lead.typing::after{content:"▌";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.btn,.go,.ghost{display:inline-block;font:inherit;font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:0;padding:11px 22px;min-height:44px;cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
.btn::before,.go::before,.ghost::before{content:"< "}
.btn::after,.go::after,.ghost::after{content:" >"}
.btn:hover,.go:hover,.ghost:hover{background:var(--accent);color:var(--bg)}
.go:active{transform:translateY(1px)}
.ghost{margin-top:18px;font-size:.72rem;padding:7px 14px;min-height:34px;letter-spacing:.1em}

main{padding:24px 0 72px;display:grid;gap:0;grid-template-columns:1fr}
.card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:clamp(24px,5vw,40px) 0}
.card h2{margin:0 0 2px;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.card h3{margin:0 0 14px;font-size:.8rem;text-align:left;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
form{display:grid;gap:18px 28px;grid-template-columns:1fr}
@media(min-width:560px){form{grid-template-columns:1fr 1fr}}
.grp{grid-column:1/-1;margin:14px 0 -6px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.grp::before{content:"// "}
label{display:grid;align-content:start;gap:4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,select{font:inherit;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;min-height:42px;width:100%;transition:border-color .2s,box-shadow .2s}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:18px;background:linear-gradient(45deg,transparent 50%,var(--muted) 50%) calc(100% - 9px) 55%/5px 5px no-repeat,linear-gradient(135deg,var(--muted) 50%,transparent 50%) calc(100% - 4px) 55%/5px 5px no-repeat}
input:hover,select:hover{border-bottom-color:var(--muted)}
input:focus,select:focus{outline:none;border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[aria-invalid=true]{border-bottom-color:var(--bad);box-shadow:0 1px 0 var(--bad)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.unit{position:relative;display:block}
.unit input{padding-right:2.6em}
.unit i{position:absolute;right:0;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:.8rem;pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;padding:0;min-height:22px;border:0;box-shadow:none;background:transparent;cursor:pointer}
input[type=range]:focus{box-shadow:none}
input[type=range]:focus-visible{outline:1px dashed var(--accent);outline-offset:3px}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--muted)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;border:0;background:var(--accent);transform:rotate(45deg)}
input[type=range]::-moz-range-track{height:1px;background:var(--muted)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:0;background:var(--accent);transform:rotate(45deg)}
.e{color:var(--bad);font-size:.75rem;letter-spacing:0;text-transform:none;min-height:1em}
.full{grid-column:1/-1}
.go{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:0 0 6px}
.chips span{font-size:.75rem;color:var(--muted)}
.chip{font:inherit;font-size:.82rem;color:var(--muted);background:transparent;border:0;padding:4px 0;cursor:pointer;min-height:30px;transition:color .2s}
.chip::before{content:"[ "}.chip::after{content:" ]"}
.chip:hover{color:var(--accent)}
.result{text-align:center}
.result h2{text-align:left}
.price{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:700;letter-spacing:-.04em;color:var(--accent);margin:10px 0;font-variant-numeric:tabular-nums}
.price{font-feature-settings:"zero"}
.range{color:var(--muted);margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.empty{color:var(--muted);padding:20px 0}
.bar{margin:22px 7px 10px;position:relative;height:8px;border-bottom:1px solid var(--muted);background:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 12px) bottom/100% 5px no-repeat}
.bar b{position:absolute;left:50%;top:100%;width:10px;height:10px;margin:-5px 0 0 -5px;transform:rotate(45deg);background:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}
.note{margin-top:24px;color:var(--accent);font-style:italic;font-size:.74rem;text-align:center}
.fade{animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sk{height:12px;margin:14px auto;width:60%;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1s linear infinite}
.sk.big{height:44px;width:80%}
@keyframes sh{to{background-position:-200% 0}}
.two{display:grid;gap:32px;grid-template-columns:1fr}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.fr{display:grid;grid-template-columns:7.5em 1fr 6.5em;gap:8px;align-items:center;font-size:.82rem;margin:9px 0;text-align:left}
.fr .v{text-align:right;font-variant-numeric:tabular-nums}
.fr .t{position:relative;height:4px;background:var(--soft)}
.fr .t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.fr .t i{position:absolute;top:0;bottom:0}
.up{color:var(--accent)}.dn{color:var(--bad)}
.fr.tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.cmp{display:grid;grid-template-columns:7em 1fr 1fr;gap:8px 12px;font-size:.85rem;text-align:left}
.cmp .h{font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
.cmp .k{color:var(--muted)}
.cmp .p{font-weight:700;font-size:1rem}
.hint{color:var(--muted);font-size:.82rem}
.motion{position:absolute;right:clamp(16px,4vw,40px);bottom:20px;z-index:4;width:36px;height:36px;display:grid;place-items:center;padding:0;background:transparent;color:var(--muted);border:1px solid var(--line);cursor:pointer;transition:color .2s,border-color .2s}
.motion:hover{color:var(--accent);border-color:var(--accent)}
.motion svg{width:14px;height:14px}
/* ตัวอักษรไทยไม่ควรถ่างระยะ */
:lang(th) :is(.grp,label,.range,.btn,.go,.ghost,.card h2,.card h3,.cmp .h,.tag){letter-spacing:0}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 40l4-14c1-3 3-5 6-5h20c3 0 5 1 7 3l8 9c3 1 7 2 7 7v2H6z"/><circle cx="18" cy="46" r="5"/><circle cx="46" cy="46" r="5"/></svg><span data-i="brandName"></span><span class="tag" data-i="tag"></span></div>
  <div class="tools">
    <button id="langBtn" type="button" role="switch" aria-checked="false" aria-label="Language / ภาษา"><span>TH</span><span>EN</span></button>
    <button id="themeBtn" type="button"></button>
  </div>
</header>
<section class="hero" id="hero">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="in">
    <p class="hello"><span data-i="hello"></span><span id="hid"></span></p>
    <h1 data-i="title"></h1>
    <p class="lead" id="lead" data-i="heroSub"></p>
    <a class="btn" href="#form" data-i="start"></a>
  </div>
  <button class="motion" id="motion" type="button"></button>
</section>
<main>
  <section class="card" id="form">
    <h2 data-i="formTitle"></h2>
    <p class="sub" data-i="formSub"></p>
    <div class="chips" id="chips"><span data-i="examples"></span></div>
    <form id="f" novalidate>
      <p class="grp" data-i="gCar"></p>
      <label><span data-i="brand"></span><select id="brand"></select></label>
      <label><span data-i="model"></span><input id="model" list="models" autocomplete="off" aria-describedby="e-model"><datalist id="models"></datalist><small class="e" id="e-model"></small></label>
      <p class="grp" data-i="gCond"></p>
      <label><span data-i="year"></span><input id="year" type="number" inputmode="numeric" min="2000" max="2026" value="2018" aria-describedby="e-year"><input id="yearR" type="range" min="2000" max="2026" step="1" data-al="year"><small class="e" id="e-year"></small></label>
      <label><span data-i="mileage"></span><span class="unit"><input id="mileage" type="number" inputmode="numeric" min="0" max="999999" value="80000" aria-describedby="e-mileage"><i>km</i></span><input id="mileageR" type="range" min="0" max="400000" step="5000" data-al="mileage"><small class="e" id="e-mileage"></small></label>
      <p class="grp" data-i="gEng"></p>
      <label><span data-i="trans"></span><select id="trans"><option value="AT" data-i="at"></option><option value="MT" data-i="mt"></option></select></label>
      <label><span data-i="fuel"></span><select id="fuel"><option value="gas" data-i="gas"></option><option value="diesel" data-i="diesel"></option><option value="hybrid" data-i="hybrid"></option></select></label>
      <label class="full"><span data-i="cc"></span><span class="unit"><input id="cc" type="number" inputmode="numeric" min="600" max="6000" value="1500" aria-describedby="e-cc"><i>cc</i></span><small class="e" id="e-cc"></small></label>
      <button class="go full" type="submit" data-i="go"></button>
    </form>
  </section>
  <section class="card result" aria-live="polite">
    <h2 data-i="resTitle"></h2>
    <div id="out"><p class="empty" data-i="empty"></p></div>
    <div class="note" data-i="note"></div>
  </section>
  <section class="card wide" id="more" hidden><div class="two"><div><h3 data-i="fTitle"></h3><div id="fac"></div></div><div><h3 data-i="cTitle"></h3><div id="chart"></div></div></div></section>
  <section class="card wide" id="cmp" hidden aria-live="polite"><h3 data-i="cmpTitle"></h3><div id="cmpBody"></div><button class="ghost" id="cmpClear" type="button" data-i="clear"></button></section>
</main>
<script>

const NOW=2026;
function predictPrice(x){
  const base=CARS[x.brand][x.model];
  const age=Math.max(0,NOW-x.year);
  const parts=[];
  let p=base*Math.pow(0.88,age);
  parts.push(["fAge",p-base]);
  const m=Math.max(0,x.mileage-age*15000)*0.5;
  p-=m;parts.push(["fMile",-m]);
  const mul=(k,f)=>{const q=p*f;parts.push([k,q-p]);p=q};
  if(x.trans==="MT")mul("fTrans",0.93);
  if(x.fuel==="diesel")mul("fFuel",1.04);
  if(x.fuel==="hybrid")mul("fFuel",1.08);
  mul("fCc",1+(x.cc-1500)/1500*0.1);
  if(p<base*0.08){parts.push(["fFloor",base*0.08-p]);p=base*0.08}
  return {price:Math.round(p/1000)*1000,base,parts};
}

  readCol();paintMotion();
  if(document.querySelector("input[aria-invalid=true]"))check(read());
  if(cur)paint(false);else paintCmp();
}

function fillModels(){
  const ms=Object.keys(CARS[$("brand").value]);
  $("models").replaceChildren(...ms.map(m=>new Option(m)));
  $("model").value=ms[0];
  setErr("model","");
}
function fillBrands(){
  $("brand").replaceChildren(...Object.keys(CARS).sort().map(b=>new Option(b)));
  fillModels();
  EX.forEach(e=>{
    const b=document.createElement("button");
    b.type="button";b.className="chip";b.textContent=e[1]+" "+e[2];
    b.onclick=()=>{
      $("brand").value=e[0];fillModels();
      ["model","year","mileage","trans","fuel","cc"].forEach((k,i)=>$(k).value=e[i+1]);
      syncR();$("f").requestSubmit();
    };
    $("chips").append(b);
  });
}
const syncR=()=>{$("yearR").value=$("year").value;$("mileageR").value=$("mileage").value};

function setErr(id,msg){$("e-"+id).textContent=msg;$(id).setAttribute("aria-invalid",!!msg)}
function read(){return {brand:$("brand").value,model:$("model").value.trim().toUpperCase(),year:+$("year").value,mileage:+$("mileage").value,trans:$("trans").value,fuel:$("fuel").value,cc:+$("cc").value}}
function check(x){
  const t=T[lang],inr=(id,lo,hi)=>$(id).value!==""&&+$(id).value>=lo&&+$(id).value<=hi;
  const bad={model:CARS[x.brand][x.model]?"":t.eModel,year:inr("year",2000,NOW)?"":t.eYear,mileage:inr("mileage",0,999999)?"":t.eMile,cc:inr("cc",600,6000)?"":t.eCc};
  Object.entries(bad).forEach(([k,m])=>setErr(k,m));
  const first=Object.keys(bad).find(k=>bad[k]);
  if(first)$(first).focus();
  return !first;
}

// slider <-> number input, ล้าง error เมื่อพิมพ์
[["year","yearR"],["mileage","mileageR"]].forEach(([n,r])=>{
  $(r).oninput=()=>{$(n).value=$(r).value;setErr(n,"")};
  $(n).oninput=()=>{$(r).value=$(n).value;setErr(n,"")};
});
$("cc").oninput=()=>setErr("cc","");
// ช่องรุ่น: โฟกัสแล้วล้างค่าเพื่อให้เห็นรายการทั้งหมด พิมพ์เพื่อค้นหา
$("model").onfocus=()=>{keep=$("model").value;$("model").value=""};
$("model").onblur=()=>{const v=$("model").value.trim().toUpperCase();$("model").value=v||keep;if(v)setErr("model","")};
$("brand").onchange=fillModels;
$("cmpClear").onclick=()=>{pinned=null;paintCmp()};
$("langBtn").onclick=()=>{lang=lang==="th"?"en":"th";localStorage.lang=lang;render()};
$("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.theme=theme;render()};
$("f").onsubmit=async e=>{
  e.preventDefault();
  const x=read();
  if(!check(x))return;
  const id=++seq;
  document.querySelector(".result").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  if(!reduce)$("out").innerHTML='<div class="sk big"></div><div class="sk"></div><div class="sk"></div>';
  // ราคาปัจจุบัน + อีก 5 ปีข้างหน้า (ขับปีละ 15,000 กม.)
  const [r,...fut]=await Promise.all([predictPrice(x),...[1,2,3,4,5].map(k=>predictPrice({...x,year:x.year-k,mileage:x.mileage+15000*k})),new Promise(res=>setTimeout(res,reduce?0:350))]);
  if(id!==seq)return;
  cur={x,price:r.price,base:r.base,parts:r.parts,fut:[r.price,...fut.slice(0,5).map(f=>f.price)]};
  paint(true);
};
// ===== hero: เมฆจุดรูปรถแบบ ctOS (canvas) =====
// จุดรวมกันเป็นรถ แล้วค่อยๆ เลื่อนเปลี่ยนรูปทรงวนไปเรื่อยๆ: ซีดาน → SUV → กระบะ → แฮทช์แบ็ก → รถตู้ → สปอร์ต
// ล้อสร้างเป็นยาง+ซี่ล้อให้เห็นการหมุน ตัวรถสั่นตามช่วงล่าง ถนนกับเส้นความเร็ววิ่งไปทางซ้าย จุดหลบเมาส์
// หน่วยของรูปทรง: พื้นถนนอยู่ที่ y=51 จุดกลางรถ (32,36) รถหันหน้าไปทางขวา
const cv=$("fx"),g=cv.getContext("2d");
// [ตัวรถ, หน้าต่าง, x ล้อหลัง, x ล้อหน้า, รัศมีล้อ]
const TYPES=[
  ["M5 44v-6c0-2 1.2-3.2 3-3.5l6-1 6-7c1.2-1.5 2.6-2.5 4.5-2.5h11c1.6 0 3 .7 4 2l5 6.5 9 1.5c3 .5 5 2.5 5 5.5v4.5z","M21.5 32l4-5.5c.6-.8 1.3-1.2 2.3-1.2H30v6.7z M31.5 25.3h3.6c1.2 0 2.2.5 3 1.5l4.4 5.2H31.5z",16,48,5], // ซีดาน
  ["M4 45V29c0-4 2-8 6-8.5L39 20c2 0 3.2.8 4.2 2.2L48 29.5l8 1.3c2.5.4 4 2.2 4 4.8V45z","M7 29v-4c0-1.6 1-2.8 2.6-2.8H15V29z M17 22.2h9V29h-9z M28 22.2h10c1 0 1.8.4 2.4 1.3L44.5 29H28z",15,49,5.6], // SUV
  ["M3 44V33h23.5V24c0-1 .8-2 2-2H38c1.4 0 2.6.6 3.4 1.8L46 30.5l9.5 1.4c2.6.4 4.5 2.4 4.5 5V44z","M28.5 30v-5.6c0-.6.4-1 1-1H38c.8 0 1.4.3 1.9 1l4.2 5.6z",13,48,5.4], // กระบะ
  ["M7 44V34c0-1 .2-2 .6-3L11 25.5c.7-1.3 2-2 3.5-2H32c1.6 0 3 .7 4 2l6.5 7 7.5 1.3c2.6.5 4.5 2.6 4.5 5.2V44z","M10.5 31.5l2.4-5c.5-1 1.3-1.5 2.4-1.5H23v6.5z M25 25h7c1 0 1.9.4 2.6 1.2L39.8 31.5H25z",15,46,4.8], // แฮทช์แบ็ก
  ["M4 45V23c0-2.5 2-4.5 4.5-4.5H43c1.8 0 3.4.8 4.4 2.3L55 30.5l2 .6c1.8.6 3 2.2 3 4.1V45z","M7 29v-6c0-1 .8-1.8 1.8-1.8H17V29z M19 21.2h10V29H19z M31 21.2h11.5c1 0 1.9.5 2.5 1.3L50.2 29H31z",14,49,5.2], // รถตู้
  ["M5 44v-5c0-2 1-3.2 2.8-3.6L10 35l10-6c1.4-.8 3-1.3 4.6-1.3H30c1.6 0 3 .6 4 1.8l6 4.8 13.5 1.6c3.4.4 6.5 2.6 6.5 5.6V44z","M18.5 33.5l5.6-3.6c.8-.5 1.7-.8 2.7-.8H30c1 0 1.8.4 2.6 1l4.4 3.4z",15,48,4.9] // สปอร์ต
];
const HOLD=3,MORPH=2; // วินาที: ค้างแต่ละแบบ / เวลาเลื่อนเปลี่ยนรูป
let pts=[],trail=[],nodes=[],geo=null,W=0,H=0,col="#2b93ea",mx=-1e4,my=-1e4,run=false,raf=0,last=0,clock=0,spin=0,still=false; // still = หยุดแอนิเมชัน; เล่นเองเสมอ หยุดได้ด้วยปุ่ม #motion
const ease=x=>x*x*(3-2*x);
function readCol(){col=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||col;if(still&&geo)frame(0)}
// Knothe–Rosenblatt: r1 เลือกคอลัมน์ตามสัดส่วนจุด, r2 เลือกตำแหน่งในคอลัมน์
// ⇒ จุดที่ใช้ r1,r2 เดียวกันอยู่ตำแหน่งใกล้กันในทุกรูปทรง จึงเลื่อนเปลี่ยนรูปได้นุ่มโดยไม่วิ่งไขว้กัน
function kr(cols){
  const cum=[];let s=0;
  for(const c of cols)cum.push(s+=c.length);
  return (r1,r2)=>{let lo=0,hi=cum.length-1;const k=r1*s;while(lo<hi){const m=lo+hi>>1;if(cum[m]>k)hi=m;else lo=m+1}const c=cols[lo];return [lo*2,c[Math.min(c.length-1,r2*c.length|0)]]};
}
function build(){
  W=cv.clientWidth;H=cv.clientHeight;
  if(!W||!H)return;
  const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const sc=Math.min(W*0.74,560,H*0.42*52/30)/52,cx0=W/2,cy0=H*0.34;
  const px=(u,v)=>[cx0+(u-32)*sc,cy0+(v-36)*sc];
  // วาดแต่ละแบบลง canvas ชั่วคราว (กรอบ x 2-62, y 17-52) แล้วแยกพิกเซลขอบ/เนื้อเป็นคอลัมน์
  const BW=Math.ceil(60*sc),BH=Math.ceil(35*sc),[bx,by]=px(2,17);
  const off=document.createElement("canvas");off.width=BW;off.height=BH;
  const o=off.getContext("2d",{willReadFrequently:true});
  const S=TYPES.map(([body,win,x1,x2,r])=>{
    o.setTransform(1,0,0,1,0,0);o.globalCompositeOperation="source-over";o.clearRect(0,0,BW,BH);
    o.setTransform(sc,0,0,sc,-2*sc,-17*sc);
    o.fill(new Path2D(body));
    o.globalCompositeOperation="destination-out";
    o.fill(new Path2D(win));
    o.beginPath();o.arc(x1,51-r,r+1.2,0,7);o.moveTo(x2+r+1.2,51-r);o.arc(x2,51-r,r+1.2,0,7);o.fill(); // ซุ้มล้อ
    const d=o.getImageData(0,0,BW,BH).data,A=(x,y)=>x>=0&&y>=0&&x<BW&&y<BH&&d[(y*BW+x)*4+3]>128;
    const E=[],F=[];
    for(let x=0;x<BW;x+=2){const e=[],f=[];for(let y=0;y<BH;y+=2)if(A(x,y))(A(x-4,y)&&A(x+4,y)&&A(x,y-4)&&A(x,y+4)?f:e).push(y);E.push(e);F.push(f)}
    return [kr(E),kr(F)];
  });
  const n=W<600?1300:2600,nw=n*.09|0,scat=!pts.length&&!reduce; // ฉากจุดกระจายมารวมตัว ข้ามไปถ้าเครื่องตั้งลดการเคลื่อนไหว
  // ox,oy = ระยะเบี่ยงจากตำแหน่งบ้าน ตอนแรกกระจายทั่วจอแล้วค่อยรวมเป็นรถ
  const add=(q,[hx,hy])=>{q.ox=scat?Math.random()*W-hx:0;q.oy=scat?Math.random()*H-hy:0;q.vx=q.vy=0;q.p=Math.random()*6.283;q.al=.2+Math.random()*.6;pts.push(q)};
  pts=[];trail=[];
  // ตัวรถ: 40% อยู่ที่ขอบ 60% เป็นเนื้อ; h = ตำแหน่งบ้านในแต่ละแบบ; d = หน่วงเวลาให้เปลี่ยนรูปจากหน้ารถไปท้ายรถ
  for(let i=0;i<n-2*nw;i++){
    const e=i%5<2?0:1,r1=Math.random(),r2=Math.random(),jx=Math.random()*2,jy=Math.random()*2;
    const h=S.map(s=>{const [x,y]=s[e](r1,r2);return [bx+x+jx,by+y+jy]});
    add({w:-1,h,d:(1-r1)*.3},h[0]);
  }
  // ล้อ: 60% เป็นยาง (หนาแน่นที่ขอบนอก) 40% เป็นซี่ล้อ 5 ซี่; f = สัดส่วนของรัศมีล้อ
  const WT=TYPES.map(t=>({c:[px(t[2],51-t[4]),px(t[3],51-t[4])],R:t[4]*sc}));
  for(let w=0;w<2;w++)for(let i=0;i<nw;i++){
    const sp=i%5<2,f=sp?(1+Math.random()*2.7)/5:(3.7+(1-Math.random()**2)*1.3)/5;
    const a=sp?(Math.random()*5|0)*1.2566+(Math.random()-.5)*.12:Math.random()*6.283,c=WT[0].c[w];
    add({w,a,f},[c[0]+Math.cos(a)*f*WT[0].R,c[1]+Math.sin(a)*f*WT[0].R]);
  }
  const m=W<600?9:14;
  if(nodes.length!==m)nodes=Array.from({length:m},(_,i)=>({a:i/m*6.283+Math.random()*.35,r:.9+Math.random()*.25,s:(Math.random()-.5)*.0016}));
  geo={cx0,cy0,sc,sw:52*sc,v:18*sc,WT,rx:52*sc*0.6,ry:30*sc*0.55,road:px(0,51)[1]+2,rear:px(5,0)[0],top:px(0,22)[1],bot:px(0,41)[1]};
}
function frame(t){
  if(!geo)return;
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  // ในแต่ละรอบ: ค้างแบบ k ไว้ HOLD วิ แล้วเลื่อนเปลี่ยนเป็นแบบ k2 ใน MORPH วิ
  const N=TYPES.length,ph=clock/(HOLD+MORPH),k=Math.floor(ph)%N,k2=(k+1)%N,u=(ph%1)*(HOLD+MORPH),e=u<HOLD?0:(u-HOLD)/MORPH,ew=ease(e);
  const A=geo.WT[k],B=geo.WT[k2],R=A.R+(B.R-A.R)*ew;
  if(!still){clock+=dt;spin+=dt*geo.v/R}
  const s=clock,bob=Math.sin(s*11)*1.4+Math.sin(s*23)*.6;
  g.clearRect(0,0,W,H);
  g.fillStyle=col;
  for(const q of pts){
    let hx,hy;
    if(q.w<0){const a=q.h[k],b=q.h[k2],m=ease(Math.min(1,Math.max(0,e*1.3-q.d)));hx=a[0]+(b[0]-a[0])*m;hy=a[1]+(b[1]-a[1])*m+bob}
    else{const a=A.c[q.w],b=B.c[q.w],rr=q.f*R;hx=a[0]+(b[0]-a[0])*ew+Math.cos(q.a+spin)*rr;hy=a[1]+(b[1]-a[1])*ew+Math.sin(q.a+spin)*rr}
    if(!still){
      const dx=hx+q.ox-mx,dy=hy+q.oy-my,d2=dx*dx+dy*dy;
      if(d2<6400){const f=(6400-d2)/6400*1.6/Math.sqrt(d2||1);q.vx+=dx*f;q.vy+=dy*f}
      q.vx+=(Math.sin(s*1.2+q.p)*1.2-q.ox)*.035;
      q.vy+=(Math.cos(s+q.p)*1.2-q.oy)*.035;
      q.vx*=.86;q.vy*=.86;q.ox+=q.vx;q.oy+=q.vy;
    }
    g.globalAlpha=q.al;g.fillRect(hx+q.ox,hy+q.oy,1.3,1.3);
  }
  // ถนน: เส้นประวิ่งไปทางซ้ายเร็วเท่าขอบล้อ จางที่ปลาย
  const L=geo.sw*.95,sh=(s*geo.v)%32;
  g.strokeStyle=col;g.lineWidth=1;
  for(let x=-L-sh;x<L;x+=32){const a=1-Math.abs(x+9)/L;if(a>0){g.globalAlpha=a*.5;g.beginPath();g.moveTo(geo.cx0+x,geo.road);g.lineTo(geo.cx0+x+18,geo.road);g.stroke()}}
  // เส้นความเร็วหลุดจากท้ายรถ
  if(!still){
    if(trail.length<90&&Math.random()<.7)trail.push({x:geo.rear+Math.random()*8*geo.sc,y:geo.top+Math.random()*(geo.bot-geo.top),v:geo.v*(.6+Math.random()*.9),l:1});
    trail=trail.filter(p=>(p.l-=dt*.9)>0);
    for(const p of trail){p.x-=p.v*dt;g.globalAlpha=p.l*.45;g.beginPath();g.moveTo(p.x,p.y+bob);g.lineTo(p.x+p.v*.08,p.y+bob);g.stroke()}
  }
  const P=nodes.map(nd=>{if(!still)nd.a+=nd.s;return [geo.cx0+Math.cos(nd.a)*geo.rx*nd.r,geo.cy0+Math.sin(nd.a)*geo.ry*nd.r]});
  g.globalAlpha=.3;g.lineWidth=.7;g.beginPath();
  P.forEach((p,i)=>{const q=P[(i+1)%P.length],r=P[(i+3)%P.length];g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);if(i%3===0){g.moveTo(p[0],p[1]);g.lineTo(r[0],r[1])}});
  g.stroke();
  g.globalAlpha=.9;
  P.forEach(([x,y])=>{g.beginPath();g.moveTo(x,y-5);g.lineTo(x+5,y);g.lineTo(x,y+5);g.lineTo(x-5,y);g.closePath();g.fill()});
  g.globalAlpha=1;
  if(run&&!still)raf=requestAnimationFrame(frame);
}
new ResizeObserver(()=>{build();if(still)frame(0);else if(run){cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}}).observe($("hero"));
new IntersectionObserver(([e])=>{run=e.isIntersecting;cancelAnimationFrame(raf);if(run&&!still&&geo)raf=requestAnimationFrame(frame)}).observe($("hero"));
$("hero").addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
$("hero").addEventListener("pointerleave",()=>{mx=my=-1e4});
const PLAY=SVG('<path d="M8 5v14l11-7z" fill="currentColor"/>'),PAUSE=SVG('<path d="M9 5v14M15 5v14"/>');
function paintMotion(){$("motion").innerHTML=still?PLAY:PAUSE;$("motion").setAttribute("aria-label",T[lang][still?"play":"pause"])}
$("motion").onclick=()=>{still=!still;paintMotion();cancelAnimationFrame(raf);if(!still&&run)raf=requestAnimationFrame(frame)};
$("hid").textContent=String(1e6+Math.floor(Math.random()*9e6));
fillBrands();syncR();render();
</script>
