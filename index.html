<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Used Car Price Demo</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--text:#18181b;--muted:#71717a;--line:#e7e5e4;--accent:#2563eb;--ok:#15803d;--bad:#dc2626;--soft:#f4f4f5}
[data-theme="dark"]{--bg:#0b0b0d;--card:#131316;--text:#f4f4f5;--muted:#8e8e98;--line:#26262b;--accent:#6ea0ff;--ok:#4ade80;--bad:#f87171;--soft:#1b1b20}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Sarabun","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
header,.hero,main{width:min(920px,100% - 32px);margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.tools{display:flex;gap:8px;align-items:center}
.tools button{display:grid;place-items:center;min-width:40px;height:40px;padding:0 12px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer;transition:background .2s,border-color .2s}
.tools button:hover{background:var(--soft)}
.tools #themeBtn{padding:0;width:40px}
.tools svg{width:18px;height:18px}
.hero{padding:clamp(20px,6vw,56px) 0 clamp(12px,3vw,24px)}
.hero h1{margin:10px 0 8px;font-size:clamp(1.9rem,5.5vw,3rem);line-height:1.15;letter-spacing:-.03em;font-weight:700}
.hero p{margin:0;color:var(--muted);max-width:36em;font-size:1.05rem}
.tag{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.02em}
main{padding:12px 0 56px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:1.35fr 1fr;align-items:start}}
.wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px)}
.card h2{margin:0 0 2px;font-size:1.05rem;letter-spacing:-.01em}
.card h3{margin:0 0 12px;font-size:.95rem;text-align:left;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
form{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:520px){form{grid-template-columns:1fr 1fr}}
.grp{grid-column:1/-1;margin:10px 0 -4px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label{display:grid;align-content:start;gap:6px;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;font-size:1rem;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;transition:border-color .2s,box-shadow .2s}
select{background:var(--card)}
input:hover,select:hover{border-color:var(--muted)}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[aria-invalid=true]{border-color:var(--bad)}
.unit{position:relative}
.unit input{padding-right:3.2em}
.unit i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:.82rem;pointer-events:none}
input[type=range]{padding:0;min-height:20px;border:0;box-shadow:none;accent-color:var(--text);cursor:pointer}
.e{color:var(--bad);font-size:.8rem;min-height:1em}
.go{background:var(--text);color:var(--bg);border:0;border-radius:12px;font:inherit;font-weight:600;padding:12px;min-height:50px;cursor:pointer;transition:opacity .2s,transform .15s}
.go:hover{opacity:.88}.go:active{transform:scale(.985)}
.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
.chips span{font-size:.82rem;color:var(--muted)}
.chip,.ghost{font:inherit;font-size:.85rem;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;min-height:34px;transition:background .2s,border-color .2s}
.chip:hover,.ghost:hover{background:var(--soft);border-color:var(--muted)}
.ghost{margin-top:16px;border-radius:10px}
.result{text-align:center}
.result h2{text-align:left}
.price{font-size:clamp(2.1rem,6vw,2.8rem);font-weight:700;letter-spacing:-.03em;margin:6px 0;font-variant-numeric:tabular-nums}
.range{color:var(--muted);margin:0;font-size:.9rem}
.empty{color:var(--muted);padding:24px 0}
.bar{margin:16px 6px 8px;position:relative;height:4px;border-radius:99px;background:var(--line)}
.bar b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--text);border:3px solid var(--card)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:left}
.fade{animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sk{height:14px;margin:14px auto;border-radius:8px;width:60%;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1s linear infinite}
.sk.big{height:40px;width:80%}
@keyframes sh{to{background-position:-200% 0}}
.two{display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
.fr{display:grid;grid-template-columns:7.5em 1fr 6.5em;gap:8px;align-items:center;font-size:.85rem;margin:8px 0;text-align:left}
.fr .v{text-align:right;font-variant-numeric:tabular-nums}
.fr .t{position:relative;height:6px;background:var(--soft);border-radius:99px}
.fr .t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.fr .t i{position:absolute;top:0;bottom:0;border-radius:99px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.fr.tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.cmp{display:grid;grid-template-columns:7em 1fr 1fr;gap:8px 12px;font-size:.88rem;text-align:left}
.cmp .h{font-weight:700}
.cmp .k{color:var(--muted)}
.cmp .p{font-weight:700;font-size:1rem}
.hint{color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 40l4-14c1-3 3-5 6-5h20c3 0 5 1 7 3l8 9c3 1 7 2 7 7v2H6z"/><circle cx="18" cy="46" r="5"/><circle cx="46" cy="46" r="5"/></svg><span data-i="brandName"></span></div>
  <div class="tools">
    <button id="langBtn" type="button" aria-label="Language">EN</button>
    <button id="themeBtn" type="button"></button>
  </div>
</header>
<section class="hero"><span class="tag" data-i="tag"></span><h1 data-i="title"></h1><p data-i="heroSub"></p></section>
<main>
  <section class="card">
    <h2 data-i="formTitle"></h2>
    <p class="sub" data-i="formSub"></p>
    <div class="chips" id="chips"><span data-i="examples"></span></div>
    <form id="f" novalidate>
      <p class="grp" data-i="gCar"></p>
      <label><span data-i="brand"></span><select id="brand"></select></label>
      <label><span data-i="model"></span><input id="model" list="models" autocomplete="off" aria-describedby="e-model"><datalist id="models"></datalist><small class="e" id="e-model"></small></label>
      <p class="grp" data-i="gCond"></p>
      <label><span data-i="year"></span><input id="year" type="number" inputmode="numeric" min="2000" max="2026" value="2018" aria-describedby="e-year"><input id="yearR" type="range" min="2000" max="2026" step="1" data-al="year"><small class="e" id="e-year"></small></label>
      <label><span data-i="mileage"></span><span class="unit"><input id="mileage" type="number" inputmode="numeric" min="0" max="999999" value="80000" aria-describedby="e-mileage"><i>km</i></span><input id="mileageR" type="range" min="0" max="400000" step="5000" data-al="mileage"><small class="e" id="e-mileage"></small></label>
      <p class="grp" data-i="gEng"></p>
      <label><span data-i="trans"></span><select id="trans"><option value="AT" data-i="at"></option><option value="MT" data-i="mt"></option></select></label>
      <label><span data-i="fuel"></span><select id="fuel"><option value="gas" data-i="gas"></option><option value="diesel" data-i="diesel"></option><option value="hybrid" data-i="hybrid"></option></select></label>
      <label class="full"><span data-i="cc"></span><span class="unit"><input id="cc" type="number" inputmode="numeric" min="600" max="6000" value="1500" aria-describedby="e-cc"><i>cc</i></span><small class="e" id="e-cc"></small></label>
      <button class="go full" type="submit" data-i="go"></button>
    </form>
  </section>
  <section class="card result" aria-live="polite">
    <h2 data-i="resTitle"></h2>
    <div id="out"><p class="empty" data-i="empty"></p></div>
    <div class="note" data-i="note"></div>
  </section>
  <section class="card wide" id="more" hidden><div class="two"><div><h3 data-i="fTitle"></h3><div id="fac"></div></div><div><h3 data-i="cTitle"></h3><div id="chart"></div></div></div></section>
  <section class="card wide" id="cmp" hidden aria-live="polite"><h3 data-i="cmpTitle"></h3><div id="cmpBody"></div><button class="ghost" id="cmpClear" type="button" data-i="clear"></button></section>
</main>

   x = {brand,model,year,mileage,trans,fuel,cc}
   คืน {price} ; ถ้าใส่ base (ราคาใหม่) กับ parts [[คีย์,ส่วนต่างบาท],...] เพิ่ม จะแสดงกราฟ "อะไรทำให้ราคาขึ้น/ลง" */
const NOW=2026;
function predictPrice(x){
  const base=CARS[x.brand][x.model];
  const age=Math.max(0,NOW-x.year);
  const parts=[];
  let p=base*Math.pow(0.88,age);
  parts.push(["fAge",p-base]);
  const m=Math.max(0,x.mileage-age*15000)*0.5;
  p-=m;parts.push(["fMile",-m]);
  const mul=(k,f)=>{const q=p*f;parts.push([k,q-p]);p=q};
  if(x.trans==="MT")mul("fTrans",0.93);
  if(x.fuel==="diesel")mul("fFuel",1.04);
  if(x.fuel==="hybrid")mul("fFuel",1.08);
  mul("fCc",1+(x.cc-1500)/1500*0.1);
  if(p<base*0.08){parts.push(["fFloor",base*0.08-p]);p=base*0.08}
  return {price:Math.round(p/1000)*1000,base,parts};
}

}
function paintCmp(){
  const t=T[lang];
  $("cmp").hidden=!pinned;
  if(!pinned)return;
  const B=cur!==pinned?cur:null;
  const rows=[[t.car,c=>`${c.x.brand} ${c.x.model}`],[t.year,c=>c.x.year],[t.mileage,c=>fmt(c.x.mileage)+" km"],[t.trans,c=>t[c.x.trans==="AT"?"at":"mt"]],[t.fuel,c=>t[c.x.fuel]],[t.cc,c=>fmt(c.x.cc)+" cc"]];
  let h=`<span></span><span class="h">${t.cmpA}</span><span class="h">${t.cmpB}</span>`;
  rows.forEach(([k,f])=>h+=`<span class="k">${k}</span><span>${f(pinned)}</span><span>${B?f(B):"—"}</span>`);
  h+=`<span class="k">${t.price}</span><span class="p">${fmt(pinned.price)}</span><span class="p">${B?fmt(B.price):"—"}</span>`;
  if(B){const d=B.price-pinned.price,pc=(d/pinned.price*100).toFixed(1);

}

function check(x){
  const t=T[lang],inr=(id,lo,hi)=>$(id).value!==""&&+$(id).value>=lo&&+$(id).value<=hi;
  const bad={model:CARS[x.brand][x.model]?"":t.eModel,year:inr("year",2000,NOW)?"":t.eYear,mileage:inr("mileage",0,999999)?"":t.eMile,cc:inr("cc",600,6000)?"":t.eCc};
  Object.entries(bad).forEach(([k,m])=>setErr(k,m));
  const first=Object.keys(bad).find(k=>bad[k]);
  if(first)$(first).focus();
  return !first;
}

// slider <-> number input, ล้าง error เมื่อพิมพ์
[["year","yearR"],["mileage","mileageR"]].forEach(([n,r])=>{
  $(r).oninput=()=>{$(n).value=$(r).value;setErr(n,"")};
  $(n).oninput=()=>{$(r).value=$(n).value;setErr(n,"")};
});
$("cc").oninput=()=>setErr("cc","");
// ช่องรุ่น: โฟกัสแล้วล้างค่าเพื่อให้เห็นรายการทั้งหมด พิมพ์เพื่อค้นหา
$("model").onfocus=()=>{keep=$("model").value;$("model").value=""};
$("model").onblur=()=>{const v=$("model").value.trim().toUpperCase();$("model").value=v||keep;if(v)setErr("model","")};
$("brand").onchange=fillModels;
$("cmpClear").onclick=()=>{pinned=null;paintCmp()};
$("langBtn").onclick=()=>{lang=lang==="th"?"en":"th";localStorage.lang=lang;render()};
$("themeBtn").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.theme=theme;render()};
$("f").onsubmit=async e=>{
  e.preventDefault();
  const x=read();
  if(!check(x))return;
  const id=++seq;
  if(!reduce)$("out").innerHTML='<div class="sk big"></div><div class="sk"></div><div class="sk"></div>';
  // ราคาปัจจุบัน + อีก 5 ปีข้างหน้า (ขับปีละ 15,000 กม.)
  const [r,...fut]=await Promise.all([predictPrice(x),...[1,2,3,4,5].map(k=>predictPrice({...x,year:x.year-k,mileage:x.mileage+15000*k})),new Promise(res=>setTimeout(res,reduce?0:350))]);
  if(id!==seq)return;
  cur={x,price:r.price,base:r.base,parts:r.parts,fut:[r.price,...fut.slice(0,5).map(f=>f.price)]};
  paint(true);
};
fillBrands();syncR();render();
</script>
</body>
